name: App veröffentlichen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Seite vorbereiten
        run: |
          mkdir _site
          cp -r app/. _site/
          BUILD="$(date -u +%Y-%m-%d-%H%M)-${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/$BUILD/g" _site/sw.js _site/js/version.js
          # Sicherheitsnetz: echte Reisedaten dürfen nie veröffentlicht werden
          if find _site -iname '*reise-daten*' -o -iname 'thailand-backup*' | grep -q .; then
            echo "Persönliche Daten gefunden – Abbruch!"; exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
