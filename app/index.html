<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <title>Thailand 2026</title>
  <meta name="description" content="Persönliche Reise-App für Thailand – funktioniert offline.">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    try {
      var t = localStorage.getItem('thema');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="kopf">
    <button class="kopf__zurueck" id="kopf-zurueck" type="button" aria-label="Zurück" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <span class="kopf__titel" id="kopf-titel">Thailand</span>
    <span class="kopf__rechts">
      <span class="kopf__status" id="kopf-status" hidden>Offline</span>
      <a class="kopf__sos" href="#notfall" aria-label="Notfall">SOS</a>
    </span>
  </header>

  <main id="inhalt" class="inhalt">
    <p class="laden">Lädt …</p>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <nav class="navi" aria-label="Hauptnavigation">
    <a href="#heute" data-nav="heute">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
      <span>Heute</span>
    </a>
    <a href="#plan" data-nav="plan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>Plan</span>
    </a>
    <a href="#ausgaben" data-nav="ausgaben">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="13" rx="3"/><path d="M16 12.5h2.5M2.5 10h19"/></svg>
      <span>Ausgaben</span>
    </a>
    <a href="#tagebuch" data-nav="tagebuch">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v16H6.5A1.5 1.5 0 0 0 5 20.5zM5 20.5A1.5 1.5 0 0 0 6.5 22H19v-3"/><path d="M9 8h6"/></svg>
      <span>Tagebuch</span>
    </a>
    <a href="#mehr" data-nav="mehr">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <span>Mehr</span>
    </a>
  </nav>

  <noscript><p class="karte">Bitte JavaScript aktivieren, damit die App funktioniert.</p></noscript>
</body>
</html>
