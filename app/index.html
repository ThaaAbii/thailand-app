<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <title>Thailand 2026</title>
  <meta name="description" content="Persönliche Reise-App für Thailand – funktioniert offline.">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/figtree-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/figtree-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script>
    try {
      var t = localStorage.getItem('thema');
      if (t === 'dark' || t === 'auto') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="kopf">
    <button class="kopf__zurueck" id="kopf-zurueck" type="button" aria-label="Zurück" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <span class="kopf__titel" id="kopf-titel">Thailand</span>
    <span class="kopf__rechts">
      <span class="kopf__status" id="kopf-status" hidden>Offline</span>
      <a class="kopf__sos" href="#notfall" aria-label="Notfall">SOS</a>
    </span>
  </header>

  <main id="inhalt" class="inhalt">
    <p class="laden">Lädt …</p>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <nav class="navi" aria-label="Hauptnavigation">
    <a href="#heute" data-nav="heute">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V20h-5v-6H9v6H4z"/></svg>
      <span>Heute</span>
    </a>
    <a href="#reise" data-nav="reise">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>
      <span>Reise</span>
    </a>
    <a href="#aufgaben" data-nav="aufgaben">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12.2l2.4 2.4 4.6-5"/></svg>
      <span>Aufgaben</span>
    </a>
    <a href="#geld" data-nav="geld">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6.5" width="18" height="11" rx="2.5"/><circle cx="12" cy="12" r="2.4"/></svg>
      <span>Geld</span>
    </a>
    <a href="#mehr" data-nav="mehr">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg>
      <span>Mehr</span>
    </a>
  </nav>

  <noscript><p class="karte">Bitte JavaScript aktivieren, damit die App funktioniert.</p></noscript>
</body>
</html>
