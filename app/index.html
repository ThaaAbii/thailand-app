<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <title>Thailand 2026</title>
  <meta name="description" content="Persönliche Reise-App für Thailand – funktioniert offline.">
  <meta name="theme-color" content="#f2f2f7">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/inter-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script>
    try {
      var t = localStorage.getItem('thema');
      if (t === 'dark' || t === 'auto') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="kopf">
    <span class="kopf__links">
      <button class="kopf__zurueck" id="kopf-zurueck" type="button" aria-label="Zurück" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>Zurück</span>
      </button>
    </span>
    <span class="kopf__titel" id="kopf-titel">Thailand</span>
    <span class="kopf__rechts">
      <span class="kopf__status" id="kopf-status" hidden>Offline</span>
      <a class="kopf__sos" href="#notfall" aria-label="Notfall">SOS</a>
    </span>
  </header>

  <main id="inhalt" class="inhalt">
    <p class="laden">Lädt …</p>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <nav class="navi" aria-label="Hauptnavigation">
    <a href="#plan" data-nav="plan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect class="fuellen" x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M8 2.8v3.4M16 2.8v3.4M7.5 13.5h3M13.5 13.5h3M7.5 17h3"/></svg>
      <span>Plan</span>
    </a>
    <a href="#aufgaben" data-nav="aufgaben">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle class="fuellen" cx="12" cy="12" r="8.5"/><path d="M8.3 12.3l2.5 2.5 5-5.3"/></svg>
      <span>Aufgaben</span>
    </a>
    <a href="#fluege" data-nav="buchungen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fuellen" d="M4 7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5V10a2 2 0 0 0 0 4v2.5a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5V14a2 2 0 0 0 0-4z"/><path d="M14.5 5v2M14.5 10.5v3M14.5 17v2"/></svg>
      <span>Buchungen</span>
    </a>
    <a href="#geld" data-nav="geld">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect class="fuellen" x="2.8" y="6" width="18.4" height="12" rx="2.6"/><circle cx="12" cy="12" r="2.6"/><path d="M6.3 12h.01M17.7 12h.01"/></svg>
      <span>Geld</span>
    </a>
    <a href="#mehr" data-nav="mehr">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect class="fuellen" x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect class="fuellen" x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect class="fuellen" x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect class="fuellen" x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/></svg>
      <span>Mehr</span>
    </a>
  </nav>

  <noscript><p class="karte">Bitte JavaScript aktivieren, damit die App funktioniert.</p></noscript>
</body>
</html>
